<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Recipe Management System</h1>
        <p>Add, view, edit, and delete your recipes.</p>
    </header>

    <main>
        <section class="box">
            <h2 id="formHeading">Add New Recipe</h2>
            <form id="recipeForm">
                <label for="title">Recipe Title</label>
                <input type="text" id="title" placeholder="e.g. Chicken Biryani" required>

                <label for="ingredients">Ingredients</label>
                <textarea id="ingredients" rows="4" placeholder="List the ingredients" required></textarea>

                <label for="instructions">Instructions</label>
                <textarea id="instructions" rows="4" placeholder="Write the cooking steps" required></textarea>

                <label for="image">Recipe Image (optional)</label>
                <input type="file" id="image" accept="image/*">

                <button type="submit" id="saveButton">Add Recipe</button>
                <button type="button" id="cancelButton" class="secondary" hidden>Cancel Edit</button>
            </form>
        </section>

        <section class="box">
            <h2>My Recipes</h2>
            <input type="search" id="search" placeholder="Search by title or ingredients..." aria-label="Search recipes">
            <div id="recipeList" class="recipe-list"></div>
        </section>

        <section class="box" id="detailsSection" hidden>
            <h2>Recipe Details</h2>
            <h3 id="detailsTitle"></h3>
            <img id="detailsImage" alt="Recipe photo" hidden>
            <h4>Ingredients</h4>
            <p id="detailsIngredients" class="multiline"></p>
            <h4>Instructions</h4>
            <p id="detailsInstructions" class="multiline"></p>
            <button type="button" id="closeDetails" class="secondary">Close</button>
        </section>
    </main>

    <footer>Web Engineering - Lab 08</footer>
    <script src="script.js"></script>
</body>
</html>
